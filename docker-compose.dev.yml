services:
  # ============================================
  # Infrastructure Services (từ infra/compose.yaml)
  # ============================================
  
  postgres:
    image: postgres:16
    container_name: erp-postgres-dev
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - infra_pg:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: erp-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - infra_redis:/data
    networks:
      - devnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend Service (từ backend/compose.yaml)
  # ============================================
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: erp-backend-dev
    ports:
      - "4000:4000"
    networks:
      - devnet
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp
      DB_USERNAME: app
      DB_PASSWORD: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

  # ============================================
  # Frontend Service
  # ============================================
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: erp-frontend-dev
    ports:
      - "3001:3000"
    networks:
      - devnet
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev

  # ============================================
  # My Hotel Admin Panel
  # ============================================
  
  my-hotel-admin:
    build:
      context: ./my-hotel-admin
      dockerfile: Dockerfile.dev
    container_name: erp-my-hotel-admin-dev
    ports:
      - "3000:3000"
    networks:
      - devnet
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    volumes:
      - ./my-hotel-admin:/app
      - my_hotel_admin_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev

networks:
  devnet:
    name: devnet
    external: true

volumes:
  # Sử dụng lại volumes từ infra/compose.yaml
  infra_pg:
    external: true
  infra_redis:
    external: true
  # Volumes cho node_modules (tránh conflict Windows/Linux)
  backend_node_modules:
  frontend_node_modules:
  my_hotel_admin_node_modules:
